# Sobe o banco analítico (Postgres) e o Metabase.
#   docker compose up -d
# Metabase: http://localhost:3000
services:
  postgres:
    image: postgres:16
    container_name: insurance_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-analytics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-analytics}
      POSTGRES_DB: ${POSTGRES_DB:-analytics}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"   # 5433 no host para não colidir com um Postgres local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-analytics} -d ${POSTGRES_DB:-analytics}"]
      interval: 5s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:latest
    container_name: insurance_metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db   # metadados do Metabase (H2) persistidos em volume
    volumes:
      - mbdata:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  mbdata:
